<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kek-Game · Admin</title>
<link rel="icon" href="/logo.png">
<style>
* { box-sizing: border-box; }
[hidden] { display: none !important; }
:root {
    --bg: #050807; --panel: #0a100d; --line: rgba(0,255,140,.22); --acc: #00ff88;
    --gold: #ffd23f; --red: #ff5b5b; --text: #e8f5ee; --dim: #8fa89a;
}
body {
    margin: 0; min-height: 100vh; color: var(--text); background: var(--bg);
    font: 15px/1.45 system-ui, sans-serif;
}
header {
    display: flex; align-items: center; gap: 14px; padding: 12px 20px;
    border-bottom: 1px solid var(--line); background: #070c0a; position: sticky; top: 0; z-index: 5;
}
header img { width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--acc); }
header h1 { margin: 0; font-size: 20px; }
header .stats { margin-left: auto; display: flex; gap: 16px; font-size: 14px; color: var(--dim); flex-wrap: wrap; }
header .stats b { color: var(--text); }
nav { display: flex; gap: 6px; padding: 12px 20px 0; }
nav button { position: relative; }
nav button.on { background: var(--acc); color: #04130b; }
.badge { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 10px; background: var(--red); color: #fff; font-size: 12px; }
main { padding: 16px 20px 40px; }
button {
    font: inherit; font-weight: 700; color: var(--text); background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.18); border-radius: 7px; padding: 6px 12px; cursor: pointer;
}
button:hover { border-color: var(--acc); }
button.primary { background: var(--acc); color: #04130b; border: 0; }
button.gold { background: var(--gold); color: #2a1a00; border: 0; }
button.danger { background: rgba(255,91,91,.15); border-color: rgba(255,91,91,.5); color: #ffb3b3; }
button:disabled { opacity: .45; cursor: default; }
input, textarea, select {
    font: inherit; color: var(--text); background: #0d1310; border: 1px solid var(--line);
    border-radius: 7px; padding: 7px 9px; outline: none;
}
input:focus, textarea:focus { border-color: var(--acc); }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 7px 8px; border-bottom: 1px solid rgba(255,255,255,.06); text-align: left; white-space: nowrap; }
th { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
th[data-sort] { cursor: pointer; user-select: none; }
th[data-sort]:hover { color: #fff; }
th.sorted { color: var(--gold); }
th.sorted::after { content: ' ▼'; font-size: 10px; }
th.sorted.asc::after { content: ' ▲'; }
.now { font-size: 12px; }
.now .on { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 6px #3ddc84; margin-right: 5px; }
.now small { color: var(--dim); margin-left: 4px; }
button.watch { background: #3da5ff; color: #04121f; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr:hover td { background: rgba(0,255,140,.03); }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 7px; vertical-align: -1px; }
.toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.muted { color: var(--dim); }
.msg { min-height: 1.3em; font-size: 14px; }
.msg.ok { color: var(--acc); } .msg.err { color: var(--red); }

/* Konto-Dialog */
dialog { background: var(--panel); color: var(--text); border: 1px solid var(--acc); border-radius: 12px; padding: 18px; width: min(900px, 96vw); max-height: 92vh; }
.dtabs { display: flex; gap: 6px; margin: 6px 0 10px; flex-wrap: wrap; }
.dtabs button.on { background: var(--acc); color: #04130b; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 9px; border-radius: 8px; background: rgba(255,255,255,.06); font-size: 13px; }
.chip.on { background: rgba(0,255,140,.16); border: 1px solid var(--acc); }
.chip button { padding: 1px 7px; font-size: 12px; }
.cat-h { margin: 10px 0 5px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
.luck td, .stash td { white-space: normal; }
.rar-common { color: #cfd8e3; } .rar-rare { color: #3da5ff; } .rar-epic { color: #b884ff; } .rar-legendary { color: #ffd23f; }
.t-common { color: #cfd8e3; } .t-uncommon { color: #7dffb0; } .t-rare { color: #3da5ff; } .t-epic { color: #b884ff; }
.t-legendary { color: #ffd23f; } .t-mythic { color: #ff5b5b; } .t-ultra { color: #fff; text-shadow: 0 0 8px #ff5bd6; }
.active-luck { color: var(--gold); font-weight: 800; }
dialog::backdrop { background: rgba(0,0,0,.6); }
dialog h2 { margin: 0 0 10px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
.big { font-size: 26px; font-weight: 900; color: var(--gold); }

/* Tickets */
.tk { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 14px; align-items: start; }
.tk-list { display: flex; flex-direction: column; gap: 6px; max-height: calc(100vh - 190px); overflow-y: auto; }
.tk-item { text-align: left; font-weight: 400; display: flex; flex-direction: column; gap: 2px; padding: 9px 10px; }
.tk-item.on { border-color: var(--acc); background: rgba(0,255,140,.07); }
.tk-item .top { display: flex; justify-content: space-between; gap: 8px; }
.tk-item b { font-weight: 800; }
.tk-item.unread b::after { content: ' ●'; color: var(--red); }
.tk-item small { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st { font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 8px; }
.st.open { background: rgba(0,255,140,.18); color: var(--acc); }
.st.closed { background: rgba(255,255,255,.1); color: var(--dim); }
.thread { display: flex; flex-direction: column; gap: 10px; max-height: calc(100vh - 330px); overflow-y: auto; padding: 4px; }
.bubble { max-width: 80%; padding: 9px 12px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; }
.bubble.user { align-self: flex-start; background: rgba(255,255,255,.07); border-bottom-left-radius: 3px; }
.bubble.admin { align-self: flex-end; background: rgba(0,255,140,.14); border: 1px solid rgba(0,255,140,.3); border-bottom-right-radius: 3px; }
.bubble small { display: block; margin-top: 4px; font-size: 11px; color: var(--dim); }
.reply { display: flex; gap: 8px; margin-top: 10px; }
.reply textarea { flex: 1; min-height: 70px; resize: vertical; }
@media (max-width: 860px) { .tk { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
    <img src="/logo.png" alt="">
    <h1>Kek-Game · Admin</h1>
    <div class="stats" id="stats"></div>
</header>
<nav>
    <button type="button" data-tab="users" class="on">👥 Accounts</button>
    <button type="button" data-tab="tickets">💬 Tickets<span class="badge" id="tk-badge" hidden></span></button>
    <button type="button" data-tab="log">📜 Log</button>
</nav>
<main>
    <section id="tab-users">
        <div class="toolbar">
            <input id="u-search" placeholder="Search name…" autocomplete="off">
            <span class="muted" id="u-count"></span>
        </div>
        <div class="panel" style="overflow-x:auto">
            <table>
                <thead><tr id="u-head">
                    <th data-sort="name">Name</th><th data-sort="now">Now</th><th class="num" data-sort="coins">Coins</th><th data-sort="lastSeen">Last seen</th><th class="num" data-sort="spins">Spins</th>
                    <th class="num" data-sort="biggestWin">Biggest win</th><th class="num" data-sort="bestScore">Best score</th><th class="num" data-sort="kills">Kills</th><th class="num" data-sort="achievements">Achievements</th><th data-sort="daily">Daily</th><th></th>
                </tr></thead>
                <tbody id="u-body"></tbody>
            </table>
        </div>
    </section>

    <section id="tab-tickets" hidden>
        <div class="tk">
            <div>
                <div class="toolbar">
                    <select id="tk-filter">
                        <option value="open">open</option>
                        <option value="closed">closed</option>
                        <option value="all">all</option>
                    </select>
                </div>
                <div class="tk-list" id="tk-list"></div>
            </div>
            <div class="panel" id="tk-view"><span class="muted">Pick a ticket on the left.</span></div>
        </div>
    </section>

    <section id="tab-log" hidden>
        <div class="panel" style="overflow-x:auto">
            <table>
                <thead><tr><th>When</th><th>Who</th><th>Action</th><th>Target</th><th>Detail</th></tr></thead>
                <tbody id="log-body"></tbody>
            </table>
        </div>
    </section>
</main>

<dialog id="dlg">
    <h2 id="d-name"></h2>
    <div class="muted" id="d-info"></div>
    <div class="dtabs" id="d-tabs">
        <button type="button" data-dtab="coins" class="on">💰 Coins</button>
        <button type="button" data-dtab="cos">🎨 Cosmetics</button>
        <button type="button" data-dtab="luck">🎰 Luck</button>
        <button type="button" data-dtab="arena">🔫 Arena</button>
    </div>
    <div id="dp-coins">
    <div class="row">Coins: <span class="big" id="d-coins"></span></div>
    <div class="row">
        <button type="button" data-add="100">+100</button>
        <button type="button" data-add="1000">+1k</button>
        <button type="button" data-add="10000">+10k</button>
        <button type="button" data-add="100000">+100k</button>
        <button type="button" data-add="-1000">−1k</button>
    </div>
    <div class="row">
        <input id="d-amount" type="number" step="1" placeholder="amount" style="width:140px">
        <button type="button" class="primary" id="d-give">Give</button>
        <button type="button" id="d-take">Take</button>
        <button type="button" class="gold" id="d-set">Set to</button>
    </div>
    <div class="row"><input id="d-note" placeholder="note for the log (optional)" style="flex:1"></div>
    <hr style="border-color:rgba(255,255,255,.1)">
    <div class="row">
        <button type="button" id="d-daily">Reset daily wheel</button>
        <button type="button" id="d-logout">Log out everywhere</button>
        <button type="button" class="danger" id="d-reset-soft">Reset (keep achievements + cosmetics)…</button>
        <button type="button" class="danger" id="d-reset">Reset EVERYTHING…</button>
        <button type="button" class="danger" id="d-delete">Delete account…</button>
    </div>
    </div>
    <div id="dp-cos" hidden></div>
    <div id="dp-luck" hidden></div>
    <div id="dp-arena" hidden></div>
    <div class="msg" id="d-msg"></div>
    <div class="row" style="justify-content:flex-end"><button type="button" id="d-close">Close</button></div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => Number(n).toLocaleString('en-US');
const ago = t => {
    if (!t) return '–';
    const s = (Date.now() - t) / 1000;
    if (s < 90) return 'just now';
    if (s < 5400) return Math.round(s / 60) + ' min ago';
    if (s < 129600) return Math.round(s / 3600) + ' h ago';
    return Math.round(s / 86400) + ' d ago';
};
const when = t => new Date(t).toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' });

async function api(path, opts) {
    opts = opts || {};
    const r = await fetch(path, {
        method: opts.method || 'GET',
        headers: opts.body ? { 'Content-Type': 'application/json', 'X-Admin': '1' } : { 'X-Admin': '1' },
        body: opts.body ? JSON.stringify(opts.body) : undefined
    });
    const j = await r.json().catch(() => ({ error: 'bad response' }));
    if (!r.ok) throw new Error(j.error || r.status);
    return j;
}

// ---------- Tabs ----------

let tab = 'users';
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
    tab = b.dataset.tab;
    document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
    for (const t of ['users', 'tickets', 'log']) $('tab-' + t).hidden = t !== tab;
    refresh();
});

// ---------- Overview ----------

async function loadOverview() {
    const o = await api('/api/overview');
    const tb = o.online.tables;
    $('stats').innerHTML =
        `<span>🟢 <b>${o.online.loggedIn}</b> logged in · <b>${o.online.playing}</b> on the field · <b>${o.online.connections}</b> tabs</span>` +
        `<span>🃏 <b>${(tb.blackjack || []).length}</b> · 🎡 <b>${(tb.roulette || []).length}</b> · ♠️ <b>${(tb.poker || []).length}</b> tables</span>` +
        `<span>👥 <b>${o.accounts}</b> accounts · 🪙 <b>${fmt(o.coins)}</b></span>` +
        `<span title="Where coins came from (counted since 23.09.2026)">💰 🐍 ${fmt(o.earned.snake || 0)} · 🧠 ${fmt(o.earned.events || 0)} · 🎁 ${fmt(o.earned.daily || 0)} · 🪙 DoN ${fmt(o.earned.don || 0)} · 🛠 ${fmt(o.earned.admin || 0)}</span>` +
        `<span>💬 <b>${o.ticketsOpen}</b> open</span>` +
        `<span class="muted">${esc(o.you)}</span>`;
    $('tk-badge').hidden = !o.ticketsUnread;
    $('tk-badge').textContent = o.ticketsUnread;
    document.title = (o.ticketsUnread ? `(${o.ticketsUnread}) ` : '') + 'Kek-Game · Admin';
}

// ---------- Accounts ----------

let users = [];
async function loadUsers() {
    users = (await api('/api/users')).users;
    drawUsers();
}

// Sortieren per Klick auf die Spaltenkoepfe (6.3); nochmal klicken dreht um.
// Standard: zuletzt online oben (wer gerade online ist, zaehlt als "jetzt")
let uSort = { key: 'lastSeen', dir: -1 };
const uVal = {
    name: u => u.name.toLowerCase(),
    now: u => u.now ? 1e15 - (u.now.idle || 0) : (u.lastSeen || 0),
    coins: u => u.coins,
    lastSeen: u => u.now ? Date.now() + 1e9 : (u.lastSeen || 0),
    spins: u => u.stats.spins || 0,
    biggestWin: u => u.stats.biggestWin || 0,
    bestScore: u => u.stats.bestScore || 0,
    kills: u => u.stats.kills || 0,
    achievements: u => u.achievements || 0,
    daily: u => u.daily || ''
};

function drawUsers() {
    const q = $('u-search').value.trim().toLowerCase();
    const get = uVal[uSort.key] || uVal.lastSeen;
    const list = users.filter(u => !q || u.name.toLowerCase().includes(q)).sort((a, b) => {
        const x = get(a), y = get(b);
        const c = typeof x === 'string' ? x.localeCompare(y) : x - y;
        return c * (uSort.key === 'name' ? -uSort.dir : uSort.dir) || a.name.localeCompare(b.name);
    });
    document.querySelectorAll('#u-head th[data-sort]').forEach(th => {
        th.classList.toggle('sorted', th.dataset.sort === uSort.key);
        th.classList.toggle('asc', th.dataset.sort === uSort.key && (uSort.key === 'name' ? uSort.dir === -1 : uSort.dir === 1));
    });
    $('u-count').textContent = `${list.length} of ${users.length}`;
    const today = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Berlin' }).format(new Date());
    $('u-body').innerHTML = list.map(u => `<tr>
        <td><span class="dot" style="background:${esc(u.color || '#555')}"></span><b>${esc(u.name)}</b>${u.title ? ` <span class="muted">« ${esc(u.title)} »</span>` : ''}</td>
        <td class="now">${u.now ? `<span class="on"></span>${esc(u.now.what)}${u.now.idle > 60 ? `<small>idle ${Math.round(u.now.idle / 60)} min</small>` : ''}${u.now.tabs > 1 ? `<small>${u.now.tabs} tabs</small>` : ''}${u.now.watchers ? '<small>👁</small>' : ''}` : '<span class="muted">offline</span>'}</td>
        <td class="num" style="color:var(--gold);font-weight:800">${fmt(u.coins)}</td>
        <td>${ago(u.lastSeen)}</td>
        <td class="num">${fmt(u.stats.spins)}</td>
        <td class="num">${fmt(u.stats.biggestWin)}</td>
        <td class="num">${fmt(u.stats.bestScore)}</td>
        <td class="num">${fmt(u.stats.kills)}</td>
        <td class="num">🏆 ${u.achievements || 0}</td>
        <td>${u.daily === today ? '✔ spun' : '<span class="muted">ready</span>'}</td>
        <td>${u.now ? `<button type="button" class="watch" data-watch="${esc(u.key)}" title="Watch live (read-only)">👁 Watch</button> ` : ''}<button type="button" data-user="${esc(u.key)}">Manage</button></td>
    </tr>`).join('');
}
$('u-search').oninput = drawUsers;
$('u-head').onclick = e => {
    const th = e.target.closest('th[data-sort]');
    if (!th) return;
    uSort = uSort.key === th.dataset.sort ? { key: uSort.key, dir: -uSort.dir } : { key: th.dataset.sort, dir: -1 };
    drawUsers();
};
$('u-body').onclick = async e => {
    const w = e.target.closest('[data-watch]');
    if (w) {
        // Fenster sofort oeffnen (sonst blockt der Popup-Blocker nach dem await)
        const win = window.open('about:blank', '_blank');
        try {
            const r = await api(`/api/users/${encodeURIComponent(w.dataset.watch)}/watch`, { method: 'POST', body: {} });
            if (win) win.location = r.url;
            else location.href = r.url;
        } catch (err) {
            if (win) win.close();
            alert('Watch: ' + err.message);
        }
        return;
    }
    const b = e.target.closest('[data-user]');
    if (b) openUser(b.dataset.user);
};

let cur = null;
function openUser(key) {
    cur = users.find(u => u.key === key);
    if (!cur) return;
    $('d-name').innerHTML = `<span class="dot" style="background:${esc(cur.color || '#555')}"></span>${esc(cur.name)}`;
    $('d-info').textContent = `created ${cur.created ? when(cur.created) : '–'} · last seen ${ago(cur.lastSeen)} · ${cur.sessions} active sessions`;
    $('d-coins').textContent = fmt(cur.coins);
    $('d-msg').textContent = '';
    $('d-amount').value = '';
    dtab('coins');
    $('dlg').showModal();
    loadDetail();
}

// ---------- Admin v2: Cosmetics, Luck, Arena ----------

let cat = null;       // Katalog (/api/catalog)
let det = null;       // Detail des offenen Kontos
let dTab = 'coins';

function dtab(t) {
    dTab = t;
    document.querySelectorAll('#d-tabs [data-dtab]').forEach(b => b.classList.toggle('on', b.dataset.dtab === t));
    for (const x of ['coins', 'cos', 'luck', 'arena']) $('dp-' + x).hidden = x !== t;
    drawDetail();
}
$('d-tabs').onclick = e => { const b = e.target.closest('[data-dtab]'); if (b) dtab(b.dataset.dtab); };

async function loadDetail() {
    try {
        if (!cat) cat = await api('/api/catalog');
        det = await api(`/api/users/${encodeURIComponent(cur.key)}/detail`);
        drawDetail();
    } catch (e) { msg('d-msg', e.message, 'err'); }
}

async function post(what, body, okText) {
    try {
        det = await api(`/api/users/${encodeURIComponent(cur.key)}/${what}`, { method: 'POST', body });
        msg('d-msg', okText, 'ok');
        drawDetail();
    } catch (e) { msg('d-msg', e.message, 'err'); }
}

function drawDetail() {
    if (!det || !cat) return;
    if (dTab === 'cos') drawCos();
    if (dTab === 'luck') drawLuck();
    if (dTab === 'arena') drawArena();
}

function drawCos() {
    const C = cat.cosmetics, own = new Set(det.inventory), eq = det.equipped;
    let html = `<div class="row"><b>${own.size} / ${C.items.length} owned</b>` +
        `<select id="c-add" style="flex:1">${Object.entries(C.cats).map(([k, n]) => `<optgroup label="${esc(n)}">` +
            C.items.filter(i => i.cat === k).map(i => `<option value="${i.id}" ${own.has(i.id) ? 'disabled' : ''}>${i.icon} ${esc(i.name)} · ${i.rarity} · ${fmt(i.price)}</option>`).join('') + '</optgroup>').join('')}</select>` +
        `<button type="button" class="primary" data-cos="give">Give</button><button type="button" data-cos="equip">Give + equip</button></div>` +
        `<div class="row"><button type="button" class="gold" data-cos="giveAll">Give all ${C.items.length}</button><button type="button" class="danger" data-cos="takeAll">Take all</button></div>`;
    for (const [k, n] of Object.entries(C.cats)) {
        const list = C.items.filter(i => i.cat === k && own.has(i.id));
        if (!list.length) continue;
        html += `<div class="cat-h">${esc(n)}</div><div class="chips">` + list.map(i => {
            const on = eq[k] === i.id;
            return `<span class="chip ${on ? 'on' : ''}"><span class="rar-${i.rarity}">${i.icon} ${esc(i.name)}</span>` +
                (on ? `<button type="button" data-cid="${i.id}" data-cop="unequip">✓ worn</button>` : `<button type="button" data-cid="${i.id}" data-cop="equip">wear</button>`) +
                `<button type="button" class="danger" data-cid="${i.id}" data-cop="take" title="Take away">✕</button></span>`;
        }).join('') + '</div>';
    }
    $('dp-cos').innerHTML = html;
}
$('dp-cos').onclick = e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.cos) {
        const op = b.dataset.cos;
        if (op === 'takeAll' && !confirm(`Take ALL cosmetics from ${cur.name}?`)) return;
        return post('cosmetics', { op, id: $('c-add').value }, 'Saved');
    }
    if (b.dataset.cop) post('cosmetics', { op: b.dataset.cop, id: b.dataset.cid }, 'Saved');
};

function drawLuck() {
    const rows = Object.entries(cat.luck).map(([k, g]) => {
        const r = det.rig[k];
        const active = r ? `<span class="active-luck">${r.n} left${g.mins ? ` · ≥ ${g.unit === '×' ? '×' + r.min : fmt(r.min) + ' coins'}` : ''}${r.bonus ? ' · bonus' : ''}</span>` : '<span class="muted">off</span>';
        const mins = g.mins ? `<select data-lmin="${k}">${g.mins.map(m => `<option value="${m}">≥ ${g.unit === '×' ? '×' + m : fmt(m)}</option>`).join('')}</select>` : '';
        const bonus = g.bonus ? `<label title="Free spins must trigger"><input type="checkbox" data-lbonus="${k}"> free spins</label>` : '';
        return `<tr><td><b>${esc(g.name)}</b></td><td>${active}</td>` +
            `<td><input type="number" min="1" max="1000" value="5" style="width:70px" data-ln="${k}"> rounds ${mins} ${bonus}</td>` +
            `<td><button type="button" class="gold" data-lset="${k}">Set</button> <button type="button" data-lclear="${k}" ${r ? '' : 'disabled'}>Clear</button></td></tr>`;
    }).join('');
    $('dp-luck').innerHTML = `<div class="muted">Guarantees a minimum win for the next rounds of ${esc(cur.name)}. The player sees nothing; every change goes to the log. ` +
        `Slots and Plinko hit exactly, Starlight and the wheel re-roll (Starlight: best try within 0.4 s – for huge wins use it with Bonus Buy).</div>` +
        `<table class="luck"><tbody>${rows}</tbody></table>`;
}
$('dp-luck').onclick = e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.lset) {
        const k = b.dataset.lset, q = s => $('dp-luck').querySelector(s);
        const minEl = q(`[data-lmin="${k}"]`), bonEl = q(`[data-lbonus="${k}"]`);
        post('luck', { game: k, n: Number(q(`[data-ln="${k}"]`).value), min: minEl ? Number(minEl.value) : 0, bonus: bonEl ? bonEl.checked : false }, 'Luck set');
    }
    if (b.dataset.lclear) post('luck', { game: b.dataset.lclear, n: 0 }, 'Luck cleared');
};

let aKind = 'weapon';
function drawArena() {
    const A = cat.arena, a = det.arena;
    const bases = aKind === 'weapon' ? Object.entries(A.weapons).map(([k, w]) => [k, `${w.icon} ${w.name}${w.special ? ' (case only)' : ''}`])
        : aKind === 'armor' ? Object.entries(A.armors).map(([k, x]) => [k, `${x.icon} ${x.name} · ${A.sets[x.set].name} ${x.slot}`])
        : aKind === 'pack' ? Object.entries(A.packs).map(([k, t]) => [k, `${t.icon} ${t.name} · ${t.cap} slots`])
        : Object.entries(A.utils).map(([k, t]) => [k, `${t.icon} ${t.name} · ${A.tiers[t.tier].name}`]);
    const modDefs = aKind === 'armor' ? A.armorMods : A.weaponMods;
    const modRow = i => `<select data-am="${i}"><option value="">– no effect –</option>${Object.entries(modDefs).map(([k, m]) => `<option value="${k}">${m.icon} ${m.name} (max ${m.max})</option>`).join('')}</select>` +
        `<input type="number" min="1" max="5" value="1" style="width:55px" data-al="${i}">`;
    const gear = aKind === 'weapon' || aKind === 'armor';
    if (!['weapon', 'armor', 'util', 'pack'].includes(aKind)) aKind = 'weapon';
    const loadout = new Set(Object.values(a.loadout || {}).filter(v => typeof v === 'string'));
    const rows = a.inv.slice().sort((x, y) => (y.odds || 1) - (x.odds || 1)).map(it => {
        const icon = ((it.kind === 'util' ? A.utils : it.kind === 'armor' ? A.armors : it.kind === 'pack' ? A.packs : A.weapons)[it.base] || {}).icon;
        const mods = (it.mods || []).map(m => { const d = (it.kind === 'armor' ? A.armorMods : A.weaponMods)[m.id]; return d ? `${d.icon}${d.name} ${m.lvl}` : m.id; }).join(', ');
        return `<tr><td><input type="checkbox" data-auid="${esc(it.uid)}"></td><td>${icon || '❔'} <b>${esc(it.name)}</b>${loadout.has(it.uid) ? ' <span class="muted">(loadout)</span>' : ''}</td>` +
            `<td class="t-${it.tier}">${it.tier}${it.odds > 1 ? ' · 1 in ' + fmt(it.odds) : ''}</td><td class="muted">⚡ ${fmt(it.score || 0)}</td>` +
            `<td>${esc(mods)}</td><td class="num">${it.sv || 0}⚙️</td><td><button type="button" class="danger" data-adel="${esc(it.uid)}">✕</button></td></tr>`;
    }).join('');
    $('dp-arena').innerHTML =
        `<div class="row"><b>Scrap</b> <input type="number" id="a-scrap" value="${a.scrap || 0}" style="width:120px"><button type="button" id="a-scrap-set">Set</button>` +
        `<span class="muted">Stash ${a.inv.length} / ${A.invMax}</span></div>` +
        `<div class="row"><b>Arena XP</b> <input type="number" id="a-xp" value="${(a.prog && a.prog.xp) || 0}" style="width:140px"><button type="button" id="a-xp-set">Set</button>` +
        `<span class="muted">Level ${a.level || 1}${a.prog ? ` · ${Object.values(a.prog.stats || {}).reduce((s, n) => s + n, 0)} stat / ${Object.values(a.prog.skills || {}).reduce((s, n) => s + n, 0)} skill points spent · ${a.prog.resets || 0} resets` : ''} · spent points above the new level are reset</span></div>` +
        `<div class="panel"><div class="row"><b>Create item</b>` +
        `<select id="a-kind">${[['weapon', 'Weapon'], ['armor', 'Armor'], ['util', 'Consumable'], ['pack', 'Backpack']].map(([k, n]) => `<option value="${k}" ${k === aKind ? 'selected' : ''}>${n}</option>`).join('')}</select>` +
        `<select id="a-base">${bases.map(([k, n]) => `<option value="${k}">${esc(n)}</option>`).join('')}</select>` +
        (gear ? `<select id="a-tier">${A.tiers.map((t, i) => `<option value="${i}">${t.name} (+${Math.round(A.tierBonus[i] * 100)}%)</option>`).join('')}</select>` : '') +
        `<input type="number" id="a-count" min="1" max="50" value="1" style="width:60px"> ×</div>` +
        (gear ? `<div class="row">Effects: ${modRow(0)} ${modRow(1)} ${modRow(2)}</div>` : '') +
        `<div class="row"><button type="button" class="primary" id="a-give">Give</button><span class="muted">Tier is set by you; 1 in X and score follow from tier and effects.</span></div></div>` +
        `<div class="row"><b>Stash</b><button type="button" class="danger" id="a-del-picked">Delete selected</button><button type="button" class="danger" id="a-clear">Clear stash</button></div>` +
        `<table class="stash"><tbody>${rows || '<tr><td class="muted">empty</td></tr>'}</tbody></table>`;
}
$('dp-arena').onchange = e => { if (e.target.id === 'a-kind') { aKind = e.target.value; drawArena(); } };
$('dp-arena').onclick = e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.id === 'a-scrap-set') return post('arena', { op: 'scrap', set: Number($('a-scrap').value) }, 'Scrap set');
    if (b.id === 'a-xp-set') return post('arena', { op: 'xp', set: Number($('a-xp').value) }, 'XP set');
    if (b.id === 'a-give') {
        const mods = [0, 1, 2].map(i => ({ id: $('dp-arena').querySelector(`[data-am="${i}"]`), lvl: $('dp-arena').querySelector(`[data-al="${i}"]`) }))
            .filter(x => x.id && x.id.value).map(x => ({ id: x.id.value, lvl: Number(x.lvl.value) }));
        return post('arena', { op: 'give', kind: aKind, base: $('a-base').value, tier: $('a-tier') ? Number($('a-tier').value) : 0, mods, count: Number($('a-count').value) }, 'Item given');
    }
    if (b.dataset.adel) return post('arena', { op: 'delete', uid: b.dataset.adel }, 'Deleted');
    if (b.id === 'a-del-picked') {
        const uids = [...$('dp-arena').querySelectorAll('[data-auid]:checked')].map(x => x.dataset.auid);
        if (uids.length && confirm(`Delete ${uids.length} items?`)) post('arena', { op: 'delete', uids }, 'Deleted');
        return;
    }
    if (b.id === 'a-clear' && confirm(`Clear the whole arena stash of ${cur.name}?`)) post('arena', { op: 'clear' }, 'Stash cleared');
};

async function coins(body) {
    try {
        body.note = $('d-note').value;
        const r = await api(`/api/users/${encodeURIComponent(cur.key)}/coins`, { method: 'POST', body });
        cur.coins = r.coins;
        $('d-coins').textContent = fmt(r.coins);
        msg('d-msg', `Saved – ${cur.name} now has ${fmt(r.coins)} coins`, 'ok');
        loadUsers();
        loadOverview();
    } catch (e) {
        msg('d-msg', e.message, 'err');
    }
}
document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => coins({ delta: Number(b.dataset.add) }));
$('d-give').onclick = () => { const v = Math.floor(Number($('d-amount').value)); if (v > 0) coins({ delta: v }); };
$('d-take').onclick = () => { const v = Math.floor(Number($('d-amount').value)); if (v > 0) coins({ delta: -v }); };
$('d-set').onclick = () => { const v = Math.floor(Number($('d-amount').value)); if (v >= 0 && $('d-amount').value !== '') coins({ set: v }); };
$('d-daily').onclick = async () => {
    try { await api(`/api/users/${encodeURIComponent(cur.key)}/reset-daily`, { method: 'POST', body: {} }); msg('d-msg', 'Daily wheel is ready again', 'ok'); loadUsers(); }
    catch (e) { msg('d-msg', e.message, 'err'); }
};
$('d-logout').onclick = async () => {
    if (!confirm(`Log ${cur.name} out on all devices?`)) return;
    try { const r = await api(`/api/users/${encodeURIComponent(cur.key)}/logout-all`, { method: 'POST', body: {} }); msg('d-msg', `${r.sessions} sessions ended`, 'ok'); }
    catch (e) { msg('d-msg', e.message, 'err'); }
};
$('d-delete').onclick = async () => {
    const typed = prompt(`Delete ${cur.name} for good? Coins and stats are gone.\nType the name to confirm:`);
    if (typed === null) return;
    try {
        await api(`/api/users/${encodeURIComponent(cur.key)}`, { method: 'DELETE', body: { confirm: typed } });
        $('dlg').close();
        loadUsers();
        loadOverview();
    } catch (e) {
        msg('d-msg', e.message, 'err');
    }
};
async function resetUser(soft) {
    const what = soft ? 'Coins back to 100, stats, arena stash, daily and luck are wiped.\nAchievements, title and cosmetics stay.'
        : 'Coins back to 100, stats, achievements, title, cosmetics, arena stash, daily and luck are wiped.';
    const typed = prompt(`Reset ${cur.name}${soft ? '' : ' completely'}?\n${what}\nName and password stay. Type the name to confirm:`);
    if (typed === null) return;
    try {
        await api(`/api/users/${encodeURIComponent(cur.key)}/${soft ? 'reset-soft' : 'reset-all'}`, { method: 'POST', body: { confirm: typed } });
        msg('d-msg', `${cur.name} was reset`, 'ok');
        await loadUsers();
        cur = users.find(u => u.key === cur.key) || cur;
        $('d-coins').textContent = fmt(cur.coins);
        loadDetail();
        loadOverview();
    } catch (e) {
        msg('d-msg', e.message, 'err');
    }
}
$('d-reset').onclick = () => resetUser(false);
$('d-reset-soft').onclick = () => resetUser(true);
$('d-close').onclick = () => $('dlg').close();

function msg(id, text, kind) {
    $(id).textContent = text;
    $(id).className = 'msg ' + (kind || '');
}

// ---------- Tickets ----------

let tickets = [];
let openId = null;
let openCount = -1;

async function loadTickets() {
    tickets = (await api('/api/tickets')).tickets;
    const f = $('tk-filter').value;
    const list = tickets.filter(t => f === 'all' || t.status === f);
    $('tk-list').innerHTML = list.length ? list.map(t => `<button type="button" class="tk-item ${t.id === openId ? 'on' : ''} ${t.unread ? 'unread' : ''}" data-t="${t.id}">
        <span class="top"><b>#${t.id} ${esc(t.subject)}</b><span class="st ${t.status}">${t.status}</span></span>
        <small>${esc(t.name)} · ${t.count} msg · ${ago(t.updated)}</small>
        ${t.last ? `<small>${t.last.from === 'admin' ? '↩ you: ' : ''}${esc(t.last.text)}</small>` : ''}
    </button>`).join('') : '<span class="muted">Nothing here.</span>';
    if (openId) loadTicket(openId, true);
}
$('tk-filter').onchange = loadTickets;
$('tk-list').onclick = e => {
    const b = e.target.closest('[data-t]');
    if (!b) return;
    openId = Number(b.dataset.t);
    openCount = -1;
    loadTicket(openId);
    loadTickets();
};

async function loadTicket(id, quiet) {
    const t = (await api('/api/tickets/' + id)).ticket;
    // Nicht neu zeichnen, wenn sich nichts geaendert hat (sonst geht der Entwurf verloren)
    if (quiet && t.messages.length === openCount) return;
    openCount = t.messages.length;
    const draft = $('tk-text') ? $('tk-text').value : '';
    $('tk-view').innerHTML =
        `<div class="toolbar" style="justify-content:space-between"><div><b style="font-size:18px">#${t.id} ${esc(t.subject)}</b><br>` +
        `<span class="muted">${esc(t.name)} · opened ${when(t.created)}</span></div>` +
        `<button type="button" id="tk-toggle" class="${t.status === 'open' ? '' : 'primary'}">${t.status === 'open' ? '✔ Close ticket' : 'Reopen'}</button></div>` +
        '<div class="thread" id="tk-thread">' + t.messages.map(m =>
            `<div class="bubble ${m.from}">${esc(m.text)}<small>${m.from === 'admin' ? 'Support' : esc(t.name)} · ${when(m.at)}</small></div>`).join('') + '</div>' +
        `<form class="reply" id="tk-form"><textarea id="tk-text" maxlength="1500" placeholder="Reply as Support… (Ctrl+Enter sends)"></textarea>` +
        `<button type="submit" class="primary">Send</button></form><div class="msg" id="tk-msg"></div>`;
    $('tk-text').value = draft;
    $('tk-thread').scrollTop = 1e9;
    $('tk-toggle').onclick = async () => {
        await api(`/api/tickets/${id}/status`, { method: 'POST', body: { status: t.status === 'open' ? 'closed' : 'open' } });
        openCount = -1;
        loadTickets();
        loadOverview();
    };
    $('tk-form').onsubmit = async e => {
        e.preventDefault();
        const text = $('tk-text').value.trim();
        if (!text) return;
        try {
            await api(`/api/tickets/${id}/reply`, { method: 'POST', body: { text } });
            $('tk-text').value = '';
            openCount = -1;
            loadTicket(id);
            loadTickets();
        } catch (err) {
            msg('tk-msg', err.message, 'err');
        }
    };
    $('tk-text').onkeydown = e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) $('tk-form').requestSubmit(); };
}

// ---------- Log ----------

async function loadLog() {
    const l = (await api('/api/log')).log;
    $('log-body').innerHTML = l.map(x => `<tr><td>${when(x.at)}</td><td>${esc(x.email)}</td><td>${esc(x.action)}</td><td>${esc(x.target || '')}</td>` +
        `<td class="muted">${esc(x.detail ? JSON.stringify(x.detail) : '')}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">Nothing yet.</td></tr>';
}

// ---------- Refresh ----------

async function refresh() {
    try {
        await loadOverview();
        if (tab === 'users' && !$('dlg').open) await loadUsers();
        if (tab === 'tickets') await loadTickets();
        if (tab === 'log') await loadLog();
    } catch (e) {
        $('stats').innerHTML = `<span style="color:var(--red)">⚠ ${esc(e.message)}</span>`;
    }
}
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
